<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#3b0f16"/>
      <stop offset="55%" stop-color="#17080b"/>
      <stop offset="100%" stop-color="#0a0607"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="50%" stop-color="#f0293e"/>
      <stop offset="100%" stop-color="#a3122e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="barShadow" x="-50%" y="-20%" width="200%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5c0717" flood-opacity="0.55"/>
    </filter>
    <path id="shieldPath" d="M512 160 C600 205 690 228 790 236 L790 500 C790 690 670 810 512 880 C354 810 234 690 234 500 L234 236 C334 228 424 205 512 160 Z"/>
    <clipPath id="shieldClip"><use href="#shieldPath"/></clipPath>
  </defs>

  <!-- Background (fills the square; Discord crops avatars to a circle) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Artwork, scaled to fill more of the circular avatar crop -->
  <g transform="translate(512 520) scale(1.1) translate(-512 -520)">

  <!-- Glow behind the shield -->
  <use href="#shieldPath" fill="#ff2d3d" opacity="0.5" filter="url(#glow)"/>

  <!-- Shield -->
  <use href="#shieldPath" fill="url(#shield)"/>
  <!-- Upper gloss -->
  <rect x="200" y="140" width="624" height="330" fill="url(#gloss)" clip-path="url(#shieldClip)"/>
  <!-- Inner rim -->
  <use href="#shieldPath" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="9"
       transform="translate(512 520) scale(0.9) translate(-512 -520)"/>

  <!-- Voice waveform -->
  <g fill="#ffffff" filter="url(#barShadow)">
    <rect x="304" y="440" width="56" height="140" rx="28"/>
    <rect x="394" y="370" width="56" height="280" rx="28"/>
    <rect x="484" y="290" width="56" height="440" rx="28"/>
    <rect x="574" y="370" width="56" height="280" rx="28"/>
    <rect x="664" y="440" width="56" height="140" rx="28"/>
  </g>
  </g>
</svg>
